services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cubito
      POSTGRES_USER: cubito
      POSTGRES_PASSWORD: cubito
    ports:
      - "5432:5432"
    volumes:
      - cubito-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubito -d cubito"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://cubito:cubito@db:5432/cubito?schema=public"
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-change-me-please-32-chars}"
      JWT_SESSION_EXPIRES_IN: 12h
      JWT_REMEMBER_EXPIRES_IN: 30d
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      SEED_ALEX_EMAIL: "${SEED_ALEX_EMAIL:-alex@cubito.local}"
      SEED_SANDRA_EMAIL: "${SEED_SANDRA_EMAIL:-sandra@cubito.local}"
      SEED_PASSWORD: "${SEED_PASSWORD:-CambiarEstaClave123!}"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # En local el seed es idempotente. En producción ejecútalo como tarea one-off.
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && node src/server.js"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  cubito-postgres:
